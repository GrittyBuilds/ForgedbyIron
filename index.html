<style>
  :root{
    --bg:#0A0A0B; --card:#141416; --card2:#1B1B1E; --line:#26282D;
    --txt:#F4F4F5; --mut:#8B8F96; --gold:#FF6A2C; --blue:#5b9bd5;
    --green:#5cc98a; --orange:#e0894b; --pri:#FF8A5C; --red:#C9451A;
    --bone:#ECE7DF; --steel:#C9CCD1; --iron:#3A3F47;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:'Sora',var(--font-body);
    --nav-h:64px;
  }
  h1,h2,h3,.lock-title,.sect-title,.time,.big{font-family:var(--font-display)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--txt);
    font-family:var(--font-body);
    line-height:1.45;-webkit-font-smoothing:antialiased}
  #app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
  /* Header */
  .top{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:block;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1a1b1f,#0A0A0B)}
  .brandbar{display:flex;justify-content:center;align-items:center;gap:13px}
  .brandbar .brandicon{height:58px;width:58px;flex:none;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.45))}
  .brandbar .wordmark{height:58px;width:auto;max-width:64vw;object-fit:contain;display:block}
  .hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
  .hactions{display:flex;align-items:center;gap:7px;flex:none}
  .top .h h1{margin:0;font-size:20px;letter-spacing:.2px}
  .top .h .d{font-size:12.5px;color:var(--mut);margin-top:2px}
  .iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;
    font-size:18px;flex:none}
  /* Day navigator */
  .daybar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  .daybar .arw{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:var(--card2);color:var(--txt);display:flex;align-items:center;justify-content:center;
    font-size:20px;line-height:1;flex:none}
  .daybar .arw:disabled{opacity:.32}
  .daybar .lbl{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;gap:7px;
    height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
    font-size:13.5px;font-weight:600;color:var(--txt)}
  .daybar .lbl .cal{font-size:13px;opacity:.75}
  .daybar .lbl input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;
    background:transparent;-webkit-appearance:none;appearance:none}
  .daybar .today{flex:none;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--gold);
    background:transparent;color:var(--gold);font-size:12.5px;font-weight:700}
  /* Target editor */
  .tgt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:2px}
  .tgt-f{display:flex;flex-direction:column;gap:5px}
  .tgt-f span{font-size:11px;color:var(--mut);letter-spacing:.3px;text-transform:uppercase;font-weight:600}
  /* View */
  #view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px)}
  .fade{animation:fade .22s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:13px}
  .card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .card h2 .sub{margin-left:auto;font-size:12px;color:var(--mut);font-weight:400}
  .sect-title{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);
    font-weight:700;margin:20px 4px 8px}
  /* Calorie ring */
  .ringwrap{display:flex;align-items:center;gap:16px}
  .ring{position:relative;flex:none}
  .ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .lbl b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
  .ring .lbl span{font-size:10.5px;color:var(--mut);margin-top:3px}
  .macros{flex:1;display:flex;flex-direction:column;gap:11px}
  .mrow .top-line{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
  .mrow .top-line b{font-variant-numeric:tabular-nums}
  .mrow .name{color:var(--mut)}
  .bar{height:8px;border-radius:6px;background:#26282D;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:6px;transition:width .35s ease}
  /* Day chips */
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin-bottom:4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card2);color:var(--mut);font-size:12.5px;font-weight:600;white-space:nowrap}
  .chip.on{background:var(--gold);color:#0A0A0B;border-color:var(--gold)}
  .chip.rest{opacity:.6}
  /* Exercise */
  .ex{background:var(--card);border:1px solid var(--line);border-radius:15px;margin-bottom:11px;overflow:hidden}
  .ex.pri{border-left:3px solid var(--pri)}
  .ex-h{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .ex-h .nm{font-weight:600;font-size:14.5px}
  .ex-h .tg{font-size:11.5px;color:var(--mut);margin-top:2px}
  .ex-h .last{font-size:11px;color:var(--blue);margin-top:3px}
  .pill{font-size:9px;font-weight:700;letter-spacing:1px;color:var(--pri);
    border:1px solid rgba(224,169,75,.4);background:rgba(224,169,75,.12);border-radius:6px;padding:2px 6px;flex:none}
  .sets{padding:0 10px 10px}
  .setrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line)}
  .setno{width:22px;height:22px;border-radius:7px;background:var(--card2);color:var(--mut);
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .setrow input{width:100%;background:#121214;border:1px solid var(--line);border-radius:9px;
    color:var(--txt);font-size:15px;padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums;min-width:0}
  .setrow input:focus{outline:none;border-color:var(--gold)}
  .setrow .u{font-size:10.5px;color:var(--mut);flex:none;width:20px}
  .chk{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);
    flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px;font-weight:700}
  .chk.on{background:var(--green);border-color:var(--green);color:#062;}
  /* Meals */
  .meal{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
    border-radius:14px;margin-bottom:10px;background:var(--card)}
  .meal.on{border-color:var(--green);background:linear-gradient(180deg,rgba(92,201,138,.08),var(--card))}
  .meal .info{flex:1;min-width:0}
  .meal .info .nm{font-weight:600;font-size:14px}
  .meal .info .mac{font-size:11.5px;color:var(--mut);margin-top:2px}
  .meal .info .det{font-size:11px;color:var(--mut);margin-top:3px;opacity:.85}
  .meal .kc{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none;text-align:right}
  .meal .kc b{display:block;color:var(--txt);font-size:15px}
  /* Toggle & buttons */
  .togrow{display:flex;align-items:center;gap:12px;padding:6px 2px}
  .togrow .t-nm{font-size:14px}
  .togrow .t-nm small{display:block;color:var(--mut);font-size:11.5px}
  .switch{margin-left:auto;width:50px;height:30px;border-radius:16px;background:#2a2f37;position:relative;flex:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#e8eaed;transition:transform .2s}
  .switch.on{background:var(--green)}
  .switch.on::after{transform:translateX(20px)}
  .btn{width:100%;padding:13px;border-radius:13px;border:none;font-size:14.5px;font-weight:700;
    background:var(--gold);color:#0A0A0B;margin-top:4px}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
  .btn.green{background:var(--green);color:#052}
  .field{width:100%;background:#121214;border:1px solid var(--line);border-radius:11px;
    color:var(--txt);font-size:16px;padding:12px 13px}
  .field:focus{outline:none;border-color:var(--gold)}
  .row2{display:flex;gap:9px}
  .row2 > *{flex:1}
  .inline{display:flex;gap:9px;align-items:center}
  .unit-toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
  .unit-toggle button{padding:8px 14px;background:var(--card2);color:var(--mut);border:none;font-size:13px;font-weight:600}
  .unit-toggle button.on{background:var(--gold);color:#0A0A0B}
  /* chart */
  .chart{width:100%;height:150px;display:block;margin-top:6px}
  .wlist{margin-top:10px}
  .wlist .wi{display:flex;justify-content:space-between;padding:9px 2px;border-top:1px solid var(--line);font-size:13.5px}
  .wlist .wi span{color:var(--mut)}
  .wlist .wi b{font-variant-numeric:tabular-nums}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:22px 10px}
  /* photos */
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .photos .ph{position:relative;aspect-ratio:3/4;border-radius:11px;overflow:hidden;background:var(--card2);border:1px solid var(--line)}
  .photos .ph img{width:100%;height:100%;object-fit:cover}
  .photos .ph .dt{position:absolute;left:0;right:0;bottom:0;font-size:9px;text-align:center;
    background:rgba(0,0,0,.55);padding:2px}
  .photos .ph .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  /* bottom nav */
  nav{position:absolute;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);display:flex;background:rgba(20,23,28,.92);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  nav button{flex:1;background:none;border:none;color:var(--mut);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;padding-top:8px}
  nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--gold)}
  /* sheet */
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
  .sheet-bg.on{display:block}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;
    border-top:1px solid var(--line);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);
    z-index:21;transform:translateY(100%);transition:transform .25s;max-width:520px;margin:0 auto}
  .sheet.on{transform:none}
  .sheet h3{margin:2px 0 14px;font-size:16px;text-align:center}
  .sheet .btn{margin-top:10px}
  .grabber{width:38px;height:4px;border-radius:3px;background:#3A3F47;margin:0 auto 12px}
  .banner{background:rgba(224,169,75,.1);border:1px solid rgba(224,169,75,.35);border-radius:12px;
    padding:10px 12px;font-size:12px;color:var(--mut);margin-bottom:13px}
  .banner b{color:var(--gold)}
  /* rest selector */
  .restsel{display:flex;align-items:center;gap:7px;margin:2px 4px 13px;font-size:12px;color:var(--mut);flex-wrap:wrap}
  .restsel span{margin-right:2px;font-weight:600}
  .restsel button{background:var(--card2);border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:6px 11px;font-size:12px;font-weight:700}
  .restsel button.on{background:var(--gold);color:#0A0A0B;border-color:var(--gold)}
  /* rest bar */
  .rest-bar{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
    max-width:520px;margin:0 auto;background:var(--card2);border-top:1px solid var(--line);
    align-items:center;gap:9px;padding:11px 14px;z-index:15;display:none;transform:translateY(105%);
    transition:transform .25s}
  .rest-bar.on{display:flex;transform:none}
  .rest-bar .prog{position:absolute;left:0;top:0;height:3px;background:var(--gold);width:100%;transition:width 1s linear}
  .rest-bar .time{font-size:23px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold);min-width:58px}
  .rest-bar .lab{font-size:11.5px;color:var(--mut)}
  .rest-bar .sp{flex:1}
  .rest-bar button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:13px;font-weight:700}
  .rest-bar button.skip{background:var(--gold);color:#0A0A0B;border-color:var(--gold)}
  /* stats */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px 15px 13px}
  .tile .big{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .tile .big small{font-size:15px;color:var(--mut);font-weight:700}
  .tile .lab{font-size:11.5px;color:var(--mut);margin-top:5px}
  .weekgrid{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
  .wd{flex:1;text-align:center}
  .wd .dl{font-size:11px;color:var(--mut);margin-bottom:8px}
  .wd.today .dl{color:var(--gold);font-weight:800}
  .wd .dots{display:flex;flex-direction:column;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;background:#2a2f37;flex:none;display:inline-block}
  .dot.s{background:var(--green)} .dot.m{background:var(--blue)} .dot.c{background:var(--gold)}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:15px;font-size:11.5px;color:var(--mut)}
  .legend span{display:flex;align-items:center;gap:6px}
  /* pin lock */
  .lock{position:absolute;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:24px}
  .lock.on{display:flex}
  .lock-inner{width:100%;max-width:296px;text-align:center}
  .lock-logo{font-size:26px;color:var(--gold);margin-bottom:12px}
  .lock-logo-img{width:92px;height:92px;margin:0 auto 18px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.55))}
  .lock-wordmark{width:400px;max-width:88vw;height:auto;display:block;margin:0 auto 22px}
  .lock-title{font-size:19px;font-weight:700}
  .lock-sub{font-size:13px;color:var(--mut);margin-top:6px;min-height:18px}
  .dots{display:flex;gap:16px;justify-content:center;margin:24px 0 28px}
  .dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut);display:block;transition:.15s}
  .dots i.f{background:var(--gold);border-color:var(--gold)}
  .dots.shake{animation:shk .42s}
  @keyframes shk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:264px;margin:0 auto}
  .pad button{height:62px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:23px;font-weight:600}
  .pad button.blank{background:none;border:none}
  .pad button:active{background:var(--card);transform:scale(.96)}
  .lock-link{margin-top:22px;background:none;border:none;color:var(--mut);font-size:13px;text-decoration:underline}
  /* segmented control */
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin:2px 0 14px;gap:4px}
  .seg button{flex:1;padding:9px;border:none;background:none;color:var(--mut);font-size:13.5px;font-weight:700;border-radius:9px}
  .seg button.on{background:var(--gold);color:#0A0A0B}
  /* personal records */
  .pr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .pr-i{flex:1;min-width:0}
  .pr-n{font-weight:600;font-size:14px}
  .pr-s{font-size:13px;color:var(--blue);font-weight:600;margin-top:2px}
  .pr-d{font-size:11px;color:var(--mut);margin-top:3px}
  .pr-e{text-align:right;font-size:10.5px;color:var(--mut);flex:none}
  .pr-e b{display:block;color:var(--gold);font-size:15px;font-weight:700}
  /* deload */
  .deload-due{border-color:rgba(255,106,0,.5);background:linear-gradient(180deg,rgba(255,106,0,.08),var(--card))}
  /* toast */
  .toast{position:absolute;left:50%;transform:translateX(-50%) translateY(18px);
    bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);background:var(--gold);color:#0A0A0B;
    font-weight:700;font-size:13.5px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.45);
    z-index:30;opacity:0;pointer-events:none;transition:.3s;max-width:88%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* sync dot */
  .sync-dot{width:9px;height:9px;border-radius:50%;background:var(--green);display:none;flex:none}
  .sync-dot.sync{width:14px;height:14px;background:transparent;border:2px solid rgba(255,106,0,.3);border-top-color:var(--gold);animation:spin .7s linear infinite}
  .sync-dot.err{background:var(--red)}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* food log */
  .foodchips{display:flex;flex-wrap:wrap;gap:8px}
  .foodchip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 11px;font-size:12.5px;display:flex;align-items:center;gap:9px}
  .foodchip i{color:var(--red);font-style:normal;font-size:12px}
  /* ---- phone mode: framed window on large screens ---- */
  @media (min-width:640px){
    body.vm-phone{background:radial-gradient(1200px 800px at 50% -10%, #17181c, #050506);display:flex;align-items:center;justify-content:center;padding:24px}
    body.vm-phone #app{height:min(100vh - 48px, 900px);max-height:900px;border-radius:28px;box-shadow:0 24px 70px rgba(0,0,0,.55);border:1px solid var(--line);overflow:hidden}
  }
  /* ---- computer mode: full-screen with left sidebar ---- */
  body.vm-desktop{background:#0A0A0B}
  body.vm-desktop #app{max-width:none;width:100vw;height:100vh;display:grid;grid-template-columns:214px 1fr;grid-template-rows:auto 1fr}
  body.vm-desktop .top{grid-column:2;grid-row:1;padding:20px 28px 16px}
  body.vm-desktop #view{grid-column:2;grid-row:2;padding:24px 28px 60px}
  body.vm-desktop #view > *{max-width:920px;margin-left:auto;margin-right:auto}
  body.vm-desktop nav{grid-column:1;grid-row:1 / 3;position:static;flex-direction:column;height:auto;width:auto;align-items:stretch;justify-content:flex-start;border-top:none;border-right:1px solid var(--line);background:#101012;padding:20px 12px;gap:5px;backdrop-filter:none}
  body.vm-desktop nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:13px;padding:13px 16px;border-radius:12px;font-size:14px}
  body.vm-desktop nav button svg{width:20px;height:20px}
  body.vm-desktop nav button.on{background:rgba(255,106,0,.14)}
  body.vm-desktop .rest-bar{left:214px;right:0;bottom:0;max-width:none;margin:0}
  body.vm-desktop .toast{left:auto;right:32px;bottom:28px;transform:none}
  body.vm-desktop .toast.on{transform:none}
  body.vm-desktop .sheet{left:214px}
</style>
</head>

function chartSVG(entries){
  if(entries.length<2) return `<div class="empty">Log at least two weigh-ins to see your trend.</div>`;
  const pts=entries.map(k=>({k,v:toUnitNum(data.dates[k].weight)}));
  const W=480,H=150,pad=24;
  const vs=pts.map(p=>p.v),min=Math.min(...vs),max=Math.max(...vs),rng=(max-min)||1;
  const x=i=>pad+(i/(pts.length-1))*(W-pad*2);
  const y=v=>H-pad-((v-min)/rng)*(H-pad*2);
  let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' '; });
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--gold)"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${pad}" y="14" fill="var(--mut)" font-size="11">${max.toFixed(1)}</text>
    <text x="${pad}" y="${H-6}" fill="var(--mut)" font-size="11">${min.toFixed(1)}</text></svg>`;
}

function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function currentMonday(){ const d=new Date(); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); d.setHours(0,0,0,0); return d; }
function weekKeys(){ const m=currentMonday(); return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return keyOf(d); }); }

function lineTrend(pairs,target,color){

  const W=480,H=150,pad=26;
  const vs=pairs.map(p=>p.v).concat(target?[target]:[]); let min=Math.min(...vs),max=Math.max(...vs); if(min===max){min-=1;max+=1;} const rng=max-min;
  const x=i=>pad+(i/(pairs.length-1))*(W-pad*2); const y=v=>H-pad-((v-min)/rng)*(H-pad*2);
  let d=''; pairs.forEach((p,i)=>{ d+=(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)+' '; });
  const dots=pairs.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.5" fill="${color}"/>`).join('');
  const tl=target?`<line x1="${pad}" y1="${y(target).toFixed(1)}" x2="${W-pad}" y2="${y(target).toFixed(1)}" stroke="var(--mut)" stroke-dasharray="4 4" stroke-width="1" opacity=".55"/>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${tl}<path d="${d}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${pad}" y="14" fill="var(--mut)" font-size="11">${Math.round(max)}</text><text x="${pad}" y="${H-6}" fill="var(--mut)" font-size="11">${Math.round(min)}</text></svg>`;

function getPRs(){
  const map={};
  Object.keys(data.dates).forEach(k=>{ const sets=data.dates[k].sets||{};
    Object.keys(sets).forEach(ex=>{ (sets[ex]||[]).forEach(st=>{ if(!st) return;
      const w=parseFloat(st.w), r=parseInt(st.r,10);
      if(!isNaN(w)&&w>0&&!isNaN(r)&&r>0){ const e=w*(1+r/30); if(!map[ex]||map[ex].type!=='w'||e>map[ex].e) map[ex]={type:'w',w:w,r:r,e:e,date:k}; }
      else if(!isNaN(r)&&r>0){ if(!map[ex]){ map[ex]={type:'bw',r:r,date:k,e:0}; } else if(map[ex].type==='bw'&&r>map[ex].r){ map[ex]={type:'bw',r:r,date:k,e:0}; } }
    }); }); });
  return Object.keys(map).map(ex=>Object.assign({ex},map[ex])).sort((a,b)=> b.date<a.date?-1:(b.date>a.date?1:0));
}

    <div style="font-size:12.5px;color:var(--mut)">Your best effort on every exercise you've logged. Estimated 1-rep max uses the Epley formula, so a hard set of 8 can still beat a heavy triple.</div></div>`;
  prs.forEach(p=>{ const line=p.type==='w'?`${trimN(p.w)} ${data.unit} × ${p.r}`:`${p.r} reps · bodyweight`;
    const e=p.type==='w'?`<div class="pr-e">est 1RM<b>${trimN(Math.round(p.e))} ${data.unit}</b></div>`:'';

      <div class="pr-d">${new Date(p.date+'T00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}</div></div>${e}</div>`; });
  return out;
}
function prevBestE(ex){ let best=0; const tk=todayKey();
  Object.keys(data.dates).forEach(k=>{ if(k===tk) return; const arr=(data.dates[k].sets||{})[ex]||[];
    arr.forEach(st=>{ if(!st) return; const w=parseFloat(st.w),r=parseInt(st.r,10); if(!isNaN(w)&&w>0&&!isNaN(r)&&r>0){ const e=w*(1+r/30); if(e>best) best=e; } }); });
  return best; }

function viewWeek(){

  const avgSteps=stepVals.length?Math.round(stepVals.reduce((a,b)=>a+b,0)/stepVals.length):null;
  const wk=keys.filter(k=>data.dates[k]&&data.dates[k].weight!=null);

  if(wdelta!=null){ const sign=wdelta>0?'+':''; const col=Math.abs(wdelta)<0.05?'var(--mut)':(wdelta<0?'var(--green)':'var(--gold)');
    out+=`<div style="font-size:27px;font-weight:800;color:${col}">${sign}${wdelta.toFixed(1)} <span style="font-size:14px;color:var(--mut);font-weight:600">${data.unit}</span></div>
      <div style="font-size:12px;color:var(--mut);margin-top:3px">In a recomp, slow is normal — chase the trend, not the daily number.</div>`;
  } else out+=`<div class="empty" style="padding:6px 0">Log two weigh-ins this week to see your change.</div>`;
  out+=`</div>`;

  keys.forEach((k,i)=>{ out+=`<div class="wd ${k===tk?'today':''}"><div class="dl">${L[i]}</div><div class="dots">

}

/* ---------------- REST TIMER ---------------- */
let restInt=null, restRemain=0, restInit=120;
function startRest(sec){ stopRestInt(); restInit=sec; restRemain=sec; showRest(); paintRest();
  restInt=setInterval(()=>{ restRemain--; if(restRemain<=0){ restDone(); } else paintRest(); },1000); }
function stopRestInt(){ if(restInt){ clearInterval(restInt); restInt=null; } }
function paintRest(){ document.getElementById('resttime').textContent=mmss(Math.max(0,restRemain));
  document.getElementById('restprog').style.width=Math.max(0,restRemain/restInit*100)+'%'; }
function showRest(){ const el=document.getElementById('restbar'); document.getElementById('restlab').textContent='Rest'; el.classList.add('on'); }
function hideRest(){ document.getElementById('restbar').classList.remove('on'); }
function addRest(delta){ restRemain=Math.max(1,restRemain+delta); if(delta>0){ restInit+=delta; } paintRest(); }
function skipRest(){ stopRestInt(); hideRest(); }
function restDone(){ stopRestInt(); paintRest(); beep(); vib();
  document.getElementById('resttime').textContent='0:00'; document.getElementById('restlab').textContent='Done ✓';
  setTimeout(hideRest,1400); }
function mmss(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function beep(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; const a=new AC();
  const o=a.createOscillator(),g=a.createGain(); o.connect(g); g.connect(a.destination); o.type='sine'; o.frequency.value=880;
  g.gain.setValueAtTime(0.001,a.currentTime); g.gain.exponentialRampToValueAtTime(0.15,a.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.35); o.start(); o.stop(a.currentTime+0.36);
  setTimeout(()=>{try{a.close();}catch(e){}},600); }catch(e){} }
function vib(){ try{ if(navigator.vibrate) navigator.vibrate([140,70,140]); }catch(e){} }

/* ---------------- PIN LOCK ---------------- */
let lockMode='enter', buf='', firstPin='';
function hashPin(p){ let h=5381; const s=String(p)+'|cp7salt'; for(let i=0;i<s.length;i++){ h=((h<<5)+h)+s.charCodeAt(i); h|=0; } return String(h>>>0); }
function showLock(){ document.getElementById('lock').classList.add('on'); renderLock(); }
function hideLock(){ document.getElementById('lock').classList.remove('on'); }
function renderLock(){
  const t=document.getElementById('lockTitle'), sub=document.getElementById('lockSub'), link=document.getElementById('lockLink');
  if(lockMode==='create'){ t.textContent='Create a PIN'; sub.textContent='Choose a 4-digit code to lock your tracker'; link.textContent='Skip for now'; }
  else if(lockMode==='confirm'){ t.textContent='Confirm PIN'; sub.textContent='Enter your code once more'; link.textContent='Start over'; }
  else { t.textContent='Enter PIN'; sub.textContent='Welcome back'; link.textContent='Forgot code?'; }
  buildPad(); updateDots();
}
function buildPad(){ const pad=document.getElementById('lockPad'); if(pad.dataset.built) return;
  const keys=['1','2','3','4','5','6','7','8','9','blank','0','del'];
  pad.innerHTML=keys.map(k=> k==='blank'?'<button class="blank" disabled></button>':k==='del'?'<button data-lk="del">⌫</button>':`<button data-lk="${k}">${k}</button>`).join('');
  pad.dataset.built='1';
}
function updateDots(){ const d=document.getElementById('lockDots').children; for(let i=0;i<4;i++) d[i].className=i<buf.length?'f':''; }
function lockDigit(d){ if(buf.length>=4) return; buf+=d; updateDots(); if(buf.length===4) setTimeout(lockComplete,140); }
function lockDel(){ buf=buf.slice(0,-1); updateDots(); }
function lockShake(){ const el=document.getElementById('lockDots'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),420); }
function lockComplete(){
  if(lockMode==='create'){ firstPin=buf; buf=''; lockMode='confirm'; renderLock(); }
  else if(lockMode==='confirm'){ if(buf===firstPin){ data.pinHash=hashPin(buf); data.lockSkipped=false; touchSettings(); save(); buf=''; firstPin=''; hideLock(); }
    else { lockShake(); buf=''; firstPin=''; lockMode='create'; setTimeout(renderLock,430); } }
  else { if(hashPin(buf)===data.pinHash){ buf=''; hideLock(); } else { lockShake(); buf=''; setTimeout(updateDots,430); } }
}
function initLock(){
  if(data.pinHash){ lockMode='enter'; buf=''; showLock(); }
  else if(!data.lockSkipped){ lockMode='create'; buf=''; firstPin=''; showLock(); }
}

/* ---------------- CLOUD SYNC (Supabase) ----------------
   One JSON blob per user in the `tracker_data` table, protected by
   Row-Level Security. Auth is email + password via the GoTrue REST API;
   data goes through PostgREST. No external library — plain fetch, so the
   app stays a single self-contained file. Config (project URL + anon key
   + session tokens) is stored only on this device. */
const SB_ROW='tracker_data';
function syncDefault(){ return {enabled:false,url:'',anonKey:'',email:'',token:'',refresh:'',userId:'',last:0}; }
function loadSync(){ try{ const r=localStorage.getItem('sb_sync'); if(r){ const o=JSON.parse(r); if(o&&typeof o==='object'&&'url'in o) return Object.assign(syncDefault(),o); } }catch(e){} return syncDefault(); }
function saveSync(){ try{ localStorage.setItem('sb_sync', JSON.stringify(sync)); }catch(e){} }
function syncPayload(){ const d=JSON.parse(JSON.stringify(data)); Object.keys(d.dates||{}).forEach(k=>{ if(d.dates[k]) delete d.dates[k].photos; }); return JSON.stringify(d); }
/* Auth (GoTrue) */
async function supAuth(path,body){ const r=await fetch(sync.url+'/auth/v1/'+path,{method:'POST',headers:{'apikey':sync.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,j}; }
function supSetSession(j){ sync.token=j.access_token; sync.refresh=j.refresh_token||sync.refresh; sync.userId=(j.user&&j.user.id)||sync.userId; if(j.user&&j.user.email) sync.email=j.user.email; }
async function supSignIn(email,password){ const {ok,j}=await supAuth('token?grant_type=password',{email,password}); if(!ok||!j.access_token) throw (j.error_description||j.msg||j.message||'Sign-in failed'); sync.email=email; supSetSession(j); }
async function supSignUp(email,password){ const {ok,j}=await supAuth('signup',{email,password}); if(!ok) throw (j.error_description||j.msg||j.message||'Sign-up failed'); sync.email=email; if(j.access_token){ supSetSession(j); return {session:true}; } return {session:false}; }
async function supRefresh(){ try{ const {ok,j}=await supAuth('token?grant_type=refresh_token',{refresh_token:sync.refresh}); if(ok&&j.access_token){ supSetSession(j); saveSync(); return true; } }catch(e){} return false; }
/* Data (PostgREST) — retries once through a token refresh on 401 */
async function supFetch(path,opts,_retry){ opts=opts||{};
  const h=Object.assign({'apikey':sync.anonKey,'Authorization':'Bearer '+sync.token}, opts.headers||{});
  const r=await fetch(sync.url+path, Object.assign({},opts,{headers:h}));
  if(r.status===401 && !_retry && sync.refresh){ if(await supRefresh()) return supFetch(path,opts,true); }
  return r; }
async function supPull(){ const r=await supFetch('/rest/v1/'+SB_ROW+'?select=payload&limit=1',{headers:{'Accept':'application/json'}}); if(!r.ok) throw 0; const a=await r.json(); return (Array.isArray(a)&&a.length&&a[0].payload)?a[0].payload:null; }
async function supPush(){ if(!sync.userId) return; const body=[{user_id:sync.userId, payload:JSON.parse(syncPayload()), updated_at:new Date().toISOString()}];
  const r=await supFetch('/rest/v1/'+SB_ROW,{method:'POST',headers:{'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(body)}); if(!r.ok) throw 0; }
function mergeRemote(remote){ if(!remote||typeof remote!=='object') return;
  const rd=remote.dates||{}, ld=data.dates||{}, out={};
  new Set([...Object.keys(ld),...Object.keys(rd)]).forEach(k=>{ const a=ld[k], b=rd[k];
    let pick; if(a&&b){ pick=((b._u||0)>(a._u||0))?Object.assign({},b):Object.assign({},a); } else pick=Object.assign({}, a||b);
    if(a&&a.photos) pick.photos=a.photos; out[k]=pick; });
  data.dates=out;
  if((remote.updatedAt||0)>(data.updatedAt||0)){ ['unit','restDefault','deloadWeeks','blockStart','pinHash','lockSkipped','foods','rotationPos','rotationByPhase','phase','phaseTargets','phaseMode'].forEach(f=>{ if(remote[f]!==undefined) data[f]=remote[f]; }); data.updatedAt=remote.updatedAt; }
}
let pushTimer=null;
function schedulePush(){ if(!sync.enabled) return; setSyncDot('sync'); clearTimeout(pushTimer); pushTimer=setTimeout(async()=>{ try{ await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); }catch(e){ setSyncDot('err'); } }, 1600); }
async function startupSync(){ if(!(sync.enabled&&sync.token&&sync.userId)) return; setSyncDot('sync'); try{ const remote=await supPull(); if(remote){ mergeRemote(remote); persistLocal(); render(); } await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); }catch(e){ setSyncDot('err'); } }
function setSyncDot(s){ const el=document.getElementById('syncDot'); if(!el) return; if(!sync.enabled){ el.style.display='none'; return; } el.style.display='block'; el.className='sync-dot '+(s||'ok'); }

  if(a==='nav'){ state.tab=el.dataset.tab; render(); }

  else if(a==='setdone'){ const ex=dec(el.dataset.ex),i=+el.dataset.i; const s=dstore(); const arr=s.sets[ex]||(s.sets[ex]=[]); arr[i]=arr[i]||{}; arr[i].done=!arr[i].done;
    if(arr[i].done&&(!arr[i].w||!arr[i].r)){ const ls=lastSets(ex); if(ls&&ls[i]){ if(!arr[i].w&&ls[i].w) arr[i].w=ls[i].w; if(!arr[i].r&&ls[i].r) arr[i].r=ls[i].r;
      const row=el.closest('.setrow'); if(row){ const ins=row.querySelectorAll('input'); if(ins[0]&&!ins[0].value) ins[0].value=arr[i].w||''; if(ins[1]&&!ins[1].value) ins[1].value=arr[i].r||''; } } }
    touch(); save(); el.classList.toggle('on');
    if(arr[i].done){ startRest(data.restDefault||120); const w=parseFloat(arr[i].w),r=parseInt(arr[i].r,10);
      if(!isNaN(w)&&w>0&&!isNaN(r)&&r>0){ const cur=w*(1+r/30), prev=prevBestE(ex); if(prev>0&&cur>prev) showToast('🏆 New PR — '+ex+'!'); } } }
  else if(a==='segweek'){ state.statsView='week'; render(); }

    if(m==='custom'){ const cur=effectiveTarget(id); (data.phaseTargets=data.phaseTargets||{})[id]=Object.assign({}, data.phaseTargets[id]||cur); }
    (data.phaseMode=data.phaseMode||{})[id]=m; applyPhase(); touchSettings(); save(); render(); targetsSheet(); }
  else if(a==='savetargets'){ const g=id=>Math.round(parseFloat(val(id))); const kc=g('tgkc'),p=g('tgp'),c=g('tgc'),f=g('tgf');
    const bad=[kc,p,c,f].some(n=>isNaN(n)||n<0||n>20000); if(bad){ const m=document.getElementById('tgtmsg'); if(m) m.textContent='Enter valid numbers for all four targets.'; return; }
    const id=activePhase().id; (data.phaseTargets=data.phaseTargets||{})[id]={kc,p,c,f}; (data.phaseMode=data.phaseMode||{})[id]='custom'; applyPhase(); touchSettings(); save(); closeSheet(); render(); showToast(activePhase().name+' targets updated'); }
  else if(a==='didDeload'){ data.blockStart=todayKey(); touchSettings(); save(); render(); showToast('New training block started 💪'); }

  else if(a==='cardio'){ const s=dstore(); s.cardio=!s.cardio; touch(); save(); el.classList.toggle('on'); }
  else if(a==='addfood'){ foodSheet(); }
  else if(a==='pickfood'){ const f=(data.foods||[]).find(x=>x.id===el.dataset.id); if(f){ setVal('fdname',f.name); setVal('fdp',f.p); setVal('fdc',f.c); setVal('fdf',f.f); } }
  else if(a==='delfood'){ data.foods=(data.foods||[]).filter(x=>x.id!==el.dataset.id); touchSettings(); save(); foodSheet(); }
  else if(a==='logfood'){ const name=val('fdname').trim(); const p=+val('fdp')||0,c=+val('fdc')||0,f=+val('fdf')||0; const serv=+val('fdserv')||1; if(!name&&!p&&!c&&!f) return; const s=dstore(); (s.log=s.log||[]).push({name:name||'Food',p:Math.round(p*serv),c:Math.round(c*serv),f:Math.round(f*serv)});
    const chk=document.getElementById('fdsave'); if(name&&chk&&chk.checked&&!(data.foods||[]).some(x=>(x.name||'').toLowerCase()===name.toLowerCase())){ (data.foods=data.foods||[]).push({id:'f'+nowMs().toString(36)+Math.floor(Math.random()*10000),name,p,c,f}); touchSettings(); }
    touch(); save(); closeSheet(); render(); }
  else if(a==='dellog'){ const s=dstore(); (s.log||[]).splice(+el.dataset.i,1); touch(); save(); render(); }
  else if(a==='exportcsv'){ exportCSV(); }
  else if(a==='qweight'){ const w=fromUnit(val('qw')); if(w!=null){ dstore().weight=w; touch(); save(); render(); } }
  else if(a==='bweight'){ const w=fromUnit(val('bw')); if(w!=null){ dstore().weight=w; touch(); save(); render(); } }
  else if(a==='unit'){ data.unit=el.dataset.u; touchSettings(); save(); render(); }
  else if(a==='addphoto'){ document.getElementById('photoInput').click(); }
  else if(a==='delphoto'){ const k=el.dataset.k,pi=+el.dataset.pi; data.dates[k].photos.splice(pi,1); touch(k); save(); render(); }
  else if(a==='menu'){ menuSheet(); }
  else if(a==='closesheet'||a==='closesheet2'){ closeSheet(); }
  else if(a==='export'){ exportData(); }
  else if(a==='import'){ document.getElementById('importInput').click(); }
  else if(a==='home'){ homeSheet(); }
  else if(a==='reset'){ if(confirm('Erase all logged data? This cannot be undone.')){ data={v:1,unit:data.unit,restDefault:data.restDefault||120,dates:{}}; ensureDefaults(); touchSettings(); save(); closeSheet(); render(); } }
  else if(a==='locknow'){ closeSheet(); lockMode='enter'; buf=''; showLock(); }
  else if(a==='setpin'){ closeSheet(); lockMode='create'; buf=''; firstPin=''; showLock(); }
  else if(a==='rmpin'){ if(confirm('Remove the PIN lock? The app will open without a code.')){ delete data.pinHash; data.lockSkipped=true; touchSettings(); save(); } closeSheet(); }
  else if(a==='setview'){ data.viewMode=el.dataset.v; touchSettings(); save(); applyViewMode(); menuSheet(); }
  else if(a==='syncsetup'){ syncSheet(); }
  else if(a==='syncconnect'){ const f=supReadForm(); if(!f.url||!f.key||!f.email||!f.pass){ supMsg('Fill in all fields.'); return; } sync.url=f.url; sync.anonKey=f.key; supMsg('Signing in…');
    (async()=>{ try{ await supSignIn(f.email,f.pass); await supFinishConnect(); showToast('Cloud sync connected ✓'); }
      catch(e){ sync.enabled=false; sync.token=''; saveSync(); supMsg(typeof e==='string'?e:'Could not connect — check the URL, key, and password.'); setSyncDot('err'); } })(); }
  else if(a==='syncsignup'){ const f=supReadForm(); if(!f.url||!f.key||!f.email||!f.pass){ supMsg('Fill in all fields.'); return; } sync.url=f.url; sync.anonKey=f.key; supMsg('Creating account…');
    (async()=>{ try{ const r=await supSignUp(f.email,f.pass); if(!r.session){ supMsg('Account created — check your email to confirm, then Sign in.'); return; } await supFinishConnect(); showToast('Account created & synced ✓'); }
      catch(e){ sync.enabled=false; sync.token=''; saveSync(); supMsg(typeof e==='string'?e:'Could not create account — check the URL and key.'); setSyncDot('err'); } })(); }
  else if(a==='syncnow'){ closeSheet(); setSyncDot('sync'); (async()=>{ try{ const remote=await supPull(); if(remote){ mergeRemote(remote); persistLocal(); render(); } await supPush(); sync.last=nowMs(); saveSync(); setSyncDot('ok'); showToast('Synced ✓'); }catch(e){ setSyncDot('err'); showToast('Sync failed — try again'); } })(); }
  else if(a==='syncoff'){ if(confirm('Sign out and disconnect sync? Your data stays on this device.')){ sync=syncDefault(); saveSync(); setSyncDot(); closeSheet(); } }
});
document.addEventListener('change', e=>{
  if(e.target && e.target.id==='dayInput'){ let v=e.target.value; if(!v) return;
    const tk=todayKey(); if(v>tk) v=tk; state.day=v; render(); }
});
document.addEventListener('input', e=>{
  const el=e.target.closest('[data-in]'); if(!el) return;
  const a=el.dataset.in;
  if(a==='tgtcalc'){ updateTgtCalc(); return; }
  const s=dstore();
  if(a==='steps'){ s.steps=el.value; touch(); save(); }
  else if(a==='setw'||a==='setr'){ const ex=dec(el.dataset.ex),i=+el.dataset.i; const arr=s.sets[ex]||(s.sets[ex]=[]); arr[i]=arr[i]||{}; arr[i][a==='setw'?'w':'r']=el.value; touch(); save(); }
});
document.getElementById('photoInput').addEventListener('change', function(){
  const f=this.files&&this.files[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=function(){ const max=420; let w=img.width,h=img.height;
    if(w>h){ if(w>max){ h=h*max/w; w=max; } } else { if(h>max){ w=w*max/h; h=max; } }
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
    let d; try{ d=cv.toDataURL('image/jpeg',0.72); }catch(err){ d=null; }
    if(d){ const st=dstore(); (st.photos=st.photos||[]).push(d); try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(err){ alert('Photo added for this session, but device storage is full or blocked — export a backup to keep it.'); } render(); }
  };
  img.src=url; this.value='';
});
document.getElementById('importInput').addEventListener('change', function(){
  const f=this.files&&this.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const obj=JSON.parse(rd.result); if(obj&&obj.dates){ data=obj; data.unit=data.unit||'lb'; ensureDefaults(); touchSettings(); save(); closeSheet(); render(); alert('Backup imported.'); } else alert("That does not look like a valid backup."); }catch(e){ alert('Could not read that file.'); } };
  rd.readAsText(f); this.value='';
});
function exportData(){ const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download='forged-by-iron-backup.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); closeSheet(); }

/* ---------------- UTIL ---------------- */
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function enc(s){ return encodeURIComponent(s); }
function dec(s){ return decodeURIComponent(s); }
function csvRow(a){ return a.map(v=>{ v=(v==null?'':String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(','); }
function exportCSV(){
  const L=[]; const keys=Object.keys(data.dates).sort();
  L.push('DAILY LOG'); L.push(csvRow(['Date','Weekday','Weight ('+data.unit+')','Steps','Cardio','Calories','Protein','Carbs','Fat','Workout']));
  keys.forEach(k=>{ const d=data.dates[k], t=dayTotals(k); const wd=WD[new Date(k+'T00:00').getDay()];
    L.push(csvRow([k,wd,d.weight!=null?trimN(toUnitNum(d.weight)):'',d.steps||'',d.cardio?'Yes':'',t.kc,t.p,t.c,t.f,sessionDone(k)?'Yes':''])); });
  L.push(''); L.push('FOOD LOG'); L.push(csvRow(['Date','Food','Protein','Carbs','Fat','Calories']));
  keys.forEach(k=>{ (data.dates[k].log||[]).forEach(e=>{ const kc=(+e.p||0)*4+(+e.c||0)*4+(+e.f||0)*9; L.push(csvRow([k,e.name||'',e.p||0,e.c||0,e.f||0,kc])); }); });
  L.push(''); L.push('WORKOUT LOG'); L.push(csvRow(['Date','Exercise','Set','Weight','Reps','Done']));
  keys.forEach(k=>{ const sets=data.dates[k].sets||{}; Object.keys(sets).forEach(ex=>{ (sets[ex]||[]).forEach((st,i)=>{ if(st&&(st.w||st.r)) L.push(csvRow([k,ex,i+1,st.w||'',st.r||'',st.done?'Yes':''])); }); }); });
  L.push(''); L.push('PERSONAL RECORDS'); L.push(csvRow(['Exercise','Best','Est 1RM ('+data.unit+')','Date']));
  getPRs().forEach(p=>{ L.push(csvRow([p.ex,p.type==='w'?(trimN(p.w)+' x '+p.r):(p.r+' reps'),p.type==='w'?trimN(Math.round(p.e)):'',p.date])); });
  const blob=new Blob([L.join('\n')],{type:'text/csv'}); const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download='forged-by-iron-export.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); closeSheet();
}

document.getElementById('lockPad').addEventListener('click', e=>{ const b=e.target.closest('[data-lk]'); if(!b) return; const k=b.dataset.lk; if(k==='del') lockDel(); else lockDigit(k); });
document.getElementById('lockLink').addEventListener('click', ()=>{
  if(lockMode==='create'){ data.lockSkipped=true; touchSettings(); save(); hideLock(); }
  else if(lockMode==='confirm'){ buf=''; firstPin=''; lockMode='create'; renderLock(); }
  else { if(confirm('Forgot your PIN? This erases your logged data so you can set a new code. If you have an exported backup you can restore it afterward.')){ data={v:1,unit:data.unit||'lb',restDefault:data.restDefault||120,dates:{}}; ensureDefaults(); save(); buf=''; firstPin=''; lockMode='create'; renderLock(); } }
});
applyViewMode(); ensureDefaults(); applyPhase(); state.liftDay=getRot(); render(); initLock(); if(sync.enabled) setSyncDot('ok'); startupSync();
window.addEventListener('resize', ()=>{ if((data.viewMode||'auto')==='auto') applyViewMode(); });
let _shownDay=todayKey();
function checkDay(){ const tk=todayKey(); if(tk!==_shownDay){ _shownDay=tk; render(); } }
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkDay(); });
window.addEventListener('focus', checkDay);
